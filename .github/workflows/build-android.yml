name: Build Runner Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
      - "www/runner-cover.png"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Runner APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          test -f package.json || {
            echo "::error::package.json is missing"
            exit 1
          }

          test -f capacitor.config.json || {
            echo "::error::capacitor.config.json is missing"
            exit 1
          }

          test -f www/index.html || {
            echo "::error::www/index.html is missing"
            exit 1
          }

          echo "All required files are available."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name "sdkmanager" -type f | head -n 1)
          
          yes | $SDKMANAGER --licenses >/dev/null || true
          $SDKMANAGER \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Runner game files
        run: npx cap sync android

      - name: Apply App Icon and Portrait Orientation
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from PIL import Image

          path = "android/app/src/main/AndroidManifest.xml"
          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)

          tree = ET.parse(path)
          root = tree.getroot()

          activity_found = False
          for activity in root.findall("./application/activity"):
              name = activity.get(f"{{{android}}}name", "")
              if name == ".MainActivity" or name.endswith(".MainActivity"):
                  activity.set(f"{{{android}}}screenOrientation", "portrait")
                  activity_found = True
                  break

          if not activity_found:
              raise SystemExit("MainActivity was not found in AndroidManifest.xml")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Portrait orientation applied successfully.")

          # Setup Launcher Icons if cover image exists
          cover_path = "www/runner-cover.png"
          if os.path.exists(cover_path):
              img = Image.open(cover_path).convert("RGBA")
              
              res_dir = "android/app/src/main/res"
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192
              }
              
              for folder, sz in sizes.items():
                  target_folder = os.path.join(res_dir, folder)
                  os.makedirs(target_folder, exist_ok=True)
                  resized_img = img.resize((sz, sz), Image.Resampling.LANCZOS)
                  resized_img.save(os.path.join(target_folder, "ic_launcher.png"), "PNG")
                  resized_img.save(os.path.join(target_folder, "ic_launcher_round.png"), "PNG")
              print("App icons generated and applied successfully.")
          else:
              print("Warning: www/runner-cover.png not found, skipping icon generation.")
          PY

          grep -n "screenOrientation" "$MANIFEST"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK and Release AAB
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace

      - name: Prepare APK and AAB for download
        shell: bash
        run: |
          mkdir -p output

          # Copy Debug APK
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/Runner-debug.apk
          fi

          # Copy Release AAB
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab output/Runner-release.aab
          fi

          ls -lh output/

      - name: Upload Runner APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Runner-Android-Builds
          path: |
            output/Runner-debug.apk
            output/Runner-release.aab
          if-no-files-found: error
          retention-days: 30
          
