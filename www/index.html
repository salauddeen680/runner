<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#040718">
  <title>Runner</title>

  <style>
    /* --- RUNNER 3D PRO DESIGN --- */
    :root { --cyan: #00eaff; --blue: #176bff; --purple: #a826ff; --orange: #ff9500; --dark: #030615; }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--dark); color: white; font-family: Arial, Helvetica, sans-serif; touch-action: none; }
    #game { position: relative; width: 100%; height: 100%; overflow: hidden; background: #040718; }
    #canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
    
    /* HUD */
    #hud { position: absolute; z-index: 5; top: max(14px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; }
    .hud-left { display: flex; gap: 8px; }
    .hud-box { min-width: 78px; padding: 8px 11px; border: 1px solid rgba(0, 234, 255, 0.65); border-radius: 14px; background: rgba(2, 7, 25, 0.78); box-shadow: 0 0 15px rgba(0, 234, 255, 0.2); text-align: center; }
    .hud-label { color: #9beeff; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .hud-value { margin-top: 2px; font-size: 19px; font-weight: 900; }
    #pauseButton { width: 46px; height: 46px; border: 1px solid var(--cyan); border-radius: 50%; background: rgba(3, 8, 30, 0.85); color: white; font-size: 18px; pointer-events: auto; }

    /* Screens */
    .screen { position: absolute; z-index: 20; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px; background: radial-gradient(circle at 50% 30%, rgba(23, 107, 255, 0.3), transparent 45%), rgba(1, 3, 14, 0.8); backdrop-filter: blur(7px); }
    .panel { width: min(92vw, 430px); max-height: 94vh; overflow: auto; padding: 19px; border: 2px solid rgba(0, 234, 255, 0.8); border-radius: 28px; background: linear-gradient(150deg, rgba(8, 18, 51, 0.97), rgba(7, 4, 30, 0.97)); box-shadow: 0 0 30px rgba(0, 234, 255, 0.28), 0 0 60px rgba(168, 38, 255, 0.18); text-align: center; }
    
    h1 { font-size: clamp(38px, 10vw, 58px); line-height: 1; letter-spacing: 4px; text-transform: uppercase; background: linear-gradient(90deg, var(--cyan), white, var(--purple)); -webkit-background-clip: text; color: transparent; filter: drop-shadow(0 0 9px rgba(0, 234, 255, 0.65)); }
    h2 { margin-bottom: 10px; color: var(--cyan); font-size: 31px; }
    .tagline { margin: 9px 0 14px; color: #b7c7ff; font-size: 14px; letter-spacing: 1.5px; }

    /* Buttons */
    .primary-button { width: 100%; min-height: 55px; margin-top: 8px; border: 0; border-radius: 17px; background: linear-gradient(90deg, #00d8ff, #2367ff, #aa25ff); box-shadow: 0 7px 0 #071e7a, 0 0 20px rgba(0, 216, 255, 0.45); color: white; font-size: 19px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px;}
    .primary-button:active { transform: translateY(5px); box-shadow: 0 2px 0 #071e7a, 0 0 14px rgba(0, 216, 255, 0.4); }
    .secondary-button { width: 100%; min-height: 45px; margin-top: 8px; border: 2px solid var(--cyan); border-radius: 12px; background: transparent; color: white; font-size: 16px; font-weight: bold; text-transform: uppercase; }
    .ad-button { width: 100%; min-height: 55px; margin-top: 8px; margin-bottom:15px; border: 2px solid #00ff88; border-radius: 17px; background: rgba(0, 255, 136, 0.1); color: #00ff88; font-size: 17px; font-weight: bold; text-transform: uppercase; }

    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    
    .results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 17px 0; }
    .result-box { padding: 13px 7px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); }
    .result-box strong { display: block; color: var(--cyan); font-size: 25px; }
    .result-box span { color: #aab8e5; font-size: 11px; text-transform: uppercase; }

    /* Controls */
    #controls { position: absolute; z-index: 8; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: min(6vw, 25px); padding: 0 16px; pointer-events: none; }
    .control { width: min(20vw, 78px); height: min(20vw, 78px); border: 2px solid var(--cyan); border-radius: 50%; background: rgba(4, 13, 43, 0.82); box-shadow: 0 0 18px rgba(0, 234, 255, 0.35); color: white; font-size: 29px; font-weight: bold; pointer-events: auto; }
    .control:active { transform: scale(0.9); background: rgba(25, 104, 255, 0.85); }
    .hidden { display: none !important; }
  </style>

  <!-- Three.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
  <main id="game">
    <canvas id="canvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-box"><div class="hud-label">Score</div><div id="score" class="hud-value">0</div></div>
        <div class="hud-box"><div class="hud-label">Coins</div><div id="coins" class="hud-value">0</div></div>
      </div>
      <button id="pauseButton" aria-label="Pause game">Ⅱ</button>
    </div>

    <!-- Mobile Controls -->
    <div id="controls" class="hidden">
      <button id="leftButton" class="control">←</button>
      <button id="jumpButton" class="control">↑</button>
      <button id="rightButton" class="control">→</button>
    </div>

    <!-- HOME SCREEN -->
    <section id="menuScreen" class="screen">
      <div class="panel">
        <h1>Runner</h1>
        <p class="tagline">ULTIMATE RUN</p>
        <button id="playButton" class="primary-button">Play Game</button>
        <div class="menu-grid">
          <button id="storeBtn" class="secondary-button">🛒 Store</button>
          <button id="profileBtn" class="secondary-button">👤 Profile</button>
          <button id="settingsBtn" class="secondary-button" style="grid-column: span 2;">⚙️ Settings</button>
        </div>
      </div>
    </section>

    <!-- PAUSE SCREEN -->
    <section id="pauseScreen" class="screen hidden">
      <div class="panel">
        <h2>Paused</h2>
        <button id="resumeButton" class="primary-button">Resume</button>
        <button id="pauseHomeButton" class="secondary-button" style="margin-top: 10px;">🏠 Home</button>
      </div>
    </section>

    <!-- GAME OVER SCREEN -->
    <section id="gameOverScreen" class="screen hidden">
      <div class="panel">
        <h2>Run Over!</h2>
        <div class="results">
          <div class="result-box"><strong id="finalScore">0</strong><span>Score</span></div>
          <div class="result-box"><strong id="bestScore">0</strong><span>Best Score</span></div>
          <div class="result-box"><strong id="finalCoins">0</strong><span>Coins</span></div>
          <div class="result-box"><strong id="finalSpeed">1.0x</strong><span>Speed</span></div>
        </div>
        <button id="reviveButton" class="ad-button">📺 Watch Ad to Revive</button>
        <button id="restartButton" class="primary-button">New Game</button>
        <button id="gameOverHomeButton" class="secondary-button">🏠 Home</button>
      </div>
    </section>

    <!-- STORE SCREEN -->
    <section id="storeScreen" class="screen hidden">
      <div class="panel">
        <h2>Store</h2>
        <p class="tagline">Skins coming soon...</p>
        <button class="backHomeBtn primary-button">Back to Home</button>
      </div>
    </section>

    <!-- PROFILE SCREEN -->
    <section id="profileScreen" class="screen hidden">
      <div class="panel">
        <h2>Profile</h2>
        <p class="tagline">Player stats coming soon...</p>
        <button class="backHomeBtn primary-button">Back to Home</button>
      </div>
    </section>

    <!-- SETTINGS SCREEN -->
    <section id="settingsScreen" class="screen hidden">
      <div class="panel">
        <h2>Settings</h2>
        <p class="tagline">Audio & Controls...</p>
        <button class="backHomeBtn primary-button">Back to Home</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("canvas");
      const screens = {
        menu: document.getElementById("menuScreen"),
        pause: document.getElementById("pauseScreen"),
        gameOver: document.getElementById("gameOverScreen"),
        store: document.getElementById("storeScreen"),
        profile: document.getElementById("profileScreen"),
        settings: document.getElementById("settingsScreen")
      };
      const hud = document.getElementById("hud");
      const controls = document.getElementById("controls");

      const scoreText = document.getElementById("score");
      const coinsText = document.getElementById("coins");

      let running = false;
      let paused = false;
      let lastTime = performance.now();
      let score = 0;
      let coins = 0;
      let distance = 0;
      let speed = 50; 
      let spawnTimer = 0;
      let objects = []; 
      let isRevived = false;

      let playerLane = 0; 
      let jumpHeight = 0;
      let jumpVelocity = 0;
      const laneWidth = 3;

      // --- THREE.JS INITIALIZATION ---
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020412);
      scene.fog = new THREE.Fog(0x020412, 10, 80);

      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 7);
      camera.lookAt(0, 1, 0);

      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0x00eaff, 1.5);
      dirLight.position.set(0, 10, 5);
      scene.add(dirLight);

      // Environment Road Grid
      const grid = new THREE.GridHelper(100, 50, 0x00dfff, 0x162347);
      grid.position.y = 0;
      grid.position.z = -20;
      scene.add(grid);

      // --- LOAD PLAYER MODEL ---
      let playerModel = new THREE.Group(); 
      scene.add(playerModel);

      const loader = new THREE.GLTFLoader();
      loader.load('assets/models/Rigged male character model.glb', (gltf) => {
        scene.remove(playerModel);
        playerModel = gltf.scene;
        playerModel.scale.set(1.2, 1.2, 1.2);
        playerModel.position.set(0, 0, 0);
        scene.add(playerModel);
      }, undefined, (e) => console.log('Model loading error:', e));

      // --- OBSTACLES & COINS SPAWN ---
      function spawnObject() {
        const lane = Math.floor(Math.random() * 3) - 1; 
        const isCoin = Math.random() < 0.4;
        
        let mesh;
        if (isCoin) {
          const geo = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16);
          const mat = new THREE.MeshStandardMaterial({ color: 0xffd83d, emissive: 0xff8d00 });
          mesh = new THREE.Mesh(geo, mat);
          mesh.rotation.x = Math.PI / 2;
          mesh.position.y = 1; 
        } else {
          const geo = new THREE.BoxGeometry(2, 2, 2);
          const mat = new THREE.MeshStandardMaterial({ color: 0xff4d00, emissive: 0x880000 });
          mesh = new THREE.Mesh(geo, mat);
          mesh.position.y = 1;
        }

        mesh.position.x = lane * laneWidth;
        mesh.position.z = -80; 
        scene.add(mesh);

        objects.push({
          mesh: mesh,
          type: isCoin ? 'coin' : 'barrier',
          lane: lane,
          removed: false
        });
      }

      // --- SCREEN MANAGEMENT ---
      function showScreen(screenName) {
        Object.values(screens).forEach(s => s.classList.add('hidden'));
        if(screenName) screens[screenName].classList.remove('hidden');
      }

      function goHome() {
        running = false;
        paused = false;
        hud.classList.add("hidden");
        controls.classList.add("hidden");
        showScreen('menu');
      }

      function startGame() {
        score = 0; coins = 0; distance = 0; speed = 40;
        playerLane = 0; jumpHeight = 0; jumpVelocity = 0;
        isRevived = false;

        if (playerModel) { playerModel.position.set(0, 0, 0); }
        
        objects.forEach(obj => scene.remove(obj.mesh));
        objects = [];

        scoreText.textContent = "0";
        coinsText.textContent = "0";

        running = true; paused = false;
        lastTime = performance.now();

        showScreen(null);
        hud.classList.remove("hidden");
        controls.classList.remove("hidden");
      }

      function pauseGame() {
        if (!running || paused) return;
        paused = true;
        showScreen('pause');
        controls.classList.add("hidden");
      }

      function resumeGame() {
        if (!running) return;
        paused = false;
        lastTime = performance.now();
        showScreen(null);
        controls.classList.remove("hidden");
      }

      function endGame() {
        running = false;
        
        const best = Math.max(Number(localStorage.getItem("runnerBestScore") || 0), score);
        localStorage.setItem("runnerBestScore", String(best));

        document.getElementById("finalScore").textContent = score;
        document.getElementById("bestScore").textContent = best;
        document.getElementById("finalCoins").textContent = coins;
        document.getElementById("finalSpeed").textContent = (speed/40).toFixed(1) + "x";

        document.getElementById("reviveButton").style.display = isRevived ? "none" : "block";

        hud.classList.add("hidden");
        controls.classList.add("hidden");
        showScreen('gameOver');
      }

      function watchAdAndRevive() {
        alert("Ad watching simulation... Player Revived!");
        isRevived = true;
        
        objects.forEach(obj => {
          if (obj.mesh.position.z > -20) {
            scene.remove(obj.mesh);
            obj.removed = true;
          }
        });
        
        running = true;
        paused = false;
        lastTime = performance.now();
        showScreen(null);
        hud.classList.remove("hidden");
        controls.classList.remove("hidden");
      }

      // --- CONTROLS ---
      function moveLeft() { if (running && !paused) playerLane = Math.max(-1, playerLane - 1); }
      function moveRight() { if (running && !paused) playerLane = Math.min(1, playerLane + 1); }
      function jump() {
        if (running && !paused && jumpHeight <= 0.1) jumpVelocity = 12;
      }

      let swipeStartX = 0, swipeStartY = 0;
      canvas.addEventListener("pointerdown", e => { swipeStartX = e.clientX; swipeStartY = e.clientY; });
      canvas.addEventListener("pointerup", e => {
        if (!running || paused) return;
        const diffX = e.clientX - swipeStartX;
        const diffY = e.clientY - swipeStartY;
        if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return;
        if (Math.abs(diffX) > Math.abs(diffY)) {
          diffX > 0 ? moveRight() : moveLeft();
        } else if (diffY < 0) {
          jump();
        }
      });

      window.addEventListener("keydown", e => {
        if (e.code === "ArrowLeft") moveLeft();
        if (e.code === "ArrowRight") moveRight();
        if (e.code === "ArrowUp" || e.code === "Space") jump();
      });

      // --- GAME LOOP & UPDATES ---
      function updateLogic(delta) {
        speed = Math.min(90, speed + delta * 0.4); 
        distance += speed * delta;
        score = Math.floor(distance) + coins * 25;
        scoreText.textContent = score;

        grid.position.z += speed * delta;
        if (grid.position.z > 0) grid.position.z = -10;

        if (playerModel) {
          const targetX = playerLane * laneWidth;
          playerModel.position.x += (targetX - playerModel.position.x) * Math.min(1, delta * 15);

          if (jumpVelocity !== 0 || jumpHeight > 0) {
            jumpHeight += jumpVelocity * delta;
            jumpVelocity -= 35 * delta; 
            if (jumpHeight <= 0) { jumpHeight = 0; jumpVelocity = 0; }
            playerModel.position.y = jumpHeight;
          }
        }

        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          spawnObject();
          spawnTimer = Math.max(0.5, 1.5 - (speed - 40) / 80);
        }

        const playerBox = new THREE.Box3().setFromObject(playerModel);
        playerBox.expandByScalar(-0.4); 

        for (let i = objects.length - 1; i >= 0; i--) {
          let obj = objects[i];
          if (obj.removed) continue;

          obj.mesh.position.z += speed * delta;
          if (obj.type === 'coin') obj.mesh.rotation.y += delta * 5; 

          const objBox = new THREE.Box3().setFromObject(obj.mesh);
          if (playerBox.intersectsBox(objBox)) {
            if (obj.type === 'coin') {
              coins++;
              coinsText.textContent = coins;
              scene.remove(obj.mesh);
              obj.removed = true;
            } else {
              endGame(); 
            }
          }

          if (obj.mesh.position.z > 10) {
            scene.remove(obj.mesh);
            obj.removed = true;
          }
        }
        objects = objects.filter(o => !o.removed);
      }

      function gameLoop(currentTime) {
        const delta = Math.min(0.05, (currentTime - lastTime) / 1000);
        lastTime = currentTime;
        if (running && !paused) updateLogic(delta);
        renderer.render(scene, camera);
        requestAnimationFrame(gameLoop);
      }

      // --- EVENT BINDINGS ---
      document.getElementById("playButton").addEventListener("click", startGame);
      document.getElementById("restartButton").addEventListener("click", startGame);
      document.getElementById("pauseButton").addEventListener("click", pauseGame);
      document.getElementById("resumeButton").addEventListener("click", resumeGame);
      
      document.getElementById("leftButton").addEventListener("pointerdown", moveLeft);
      document.getElementById("rightButton").addEventListener("pointerdown", moveRight);
      document.getElementById("jumpButton").addEventListener("pointerdown", jump);

      document.getElementById("pauseHomeButton").addEventListener("click", goHome);
      document.getElementById("gameOverHomeButton").addEventListener("click", goHome);
      document.getElementById("storeBtn").addEventListener("click", () => showScreen('store'));
      document.getElementById("profileBtn").addEventListener("click", () => showScreen('profile'));
      document.getElementById("settingsBtn").addEventListener("click", () => showScreen('settings'));
      document.querySelectorAll('.backHomeBtn').forEach(btn => btn.addEventListener('click', () => showScreen('menu')));

      document.getElementById("reviveButton").addEventListener("click", watchAdAndRevive);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
