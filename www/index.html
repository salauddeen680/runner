<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5eb3ff">
  <title>Runner</title>

  <style>
    /* --- RUNNER PREMIUM UI DESIGN --- */
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Nunito:wght@700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #5eb3ff; font-family: 'Nunito', sans-serif; }
    
    #game { position: relative; width: 100%; height: 100%; overflow: hidden; }
    
    /* 3D Canvas ko sabse peeche rakha hai */
    #canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; z-index: 1; }
    
    /* UI Container */
    #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; }
    
    /* TOP MENU (Score & Coins) */
    .top-bar { display: flex; justify-content: space-between; padding: 20px 15px; width: 100%; pointer-events: auto; }
    .status-pill { background: #0a1931; color: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 8px; border: 2px solid #1a365d; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .status-pill.gold { color: #ffd700; }

    /* TITLE - Sirf RUNNER Upar */
    .title-container { width: 100%; text-align: center; margin-top: 20px; pointer-events: auto; }
    .game-title { font-family: 'Montserrat', sans-serif; font-size: 65px; font-weight: 900; color: #00eaff; text-transform: uppercase; letter-spacing: 4px; text-shadow: 4px 4px 0 #0a1931, -2px -2px 0 #0a1931, 2px -2px 0 #0a1931, -2px 2px 0 #0a1931, 2px 2px 0 #0a1931; }
    
    /* CENTER PLAY BUTTON */
    .center-menu { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
    .play-btn { background: linear-gradient(180deg, #ff8c00, #ff6a00); color: white; border: 4px solid #fff; border-radius: 40px; padding: 15px 60px; font-size: 28px; font-family: 'Montserrat', sans-serif; font-weight: 900; cursor: pointer; box-shadow: 0 8px 0 #cc5500, 0 10px 20px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; transition: transform 0.1s; letter-spacing: 2px; }
    .play-btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #cc5500, 0 5px 10px rgba(0,0,0,0.5); }
    
    /* BOTTOM NAVIGATION (Store, Profile, Settings) */
    .bottom-nav { display: flex; justify-content: center; gap: 20px; padding-bottom: 30px; pointer-events: auto; }
    .nav-btn { background: #0a1931; color: white; border: 2px solid #1a365d; border-radius: 18px; width: 90px; height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: bold; box-shadow: 0 6px 10px rgba(0,0,0,0.4); transition: transform 0.1s; cursor: pointer; }
    .nav-btn .icon { font-size: 28px; color: #4fc3f7; }
    .nav-btn.store-btn .icon { color: #ffd700; }
    .nav-btn:active { transform: scale(0.95); }

    /* MODAL PANELS (Popups) */
    .modal-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 20; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); pointer-events: auto; }
    .modal-panel { background: #0a1931; border: 3px solid #00eaff; border-radius: 20px; width: 85%; max-width: 400px; padding: 25px; color: white; text-align: center; box-shadow: 0 10px 40px rgba(0,234,255,0.2); }
    .modal-title { font-family: 'Montserrat', sans-serif; font-size: 26px; color: #00eaff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
    
    .setting-row { display: flex; justify-content: space-between; background: #14284d; padding: 15px; border-radius: 12px; margin-bottom: 12px; align-items: center; font-size: 16px; border: 1px solid #1e3a6e; }
    .setting-row strong { color: #00eaff; }
    
    .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .store-item { background: #14284d; padding: 15px; border-radius: 12px; border: 2px solid #1e3a6e; font-size: 14px; font-weight: bold; }
    .store-item span { color: #ffd700; display: block; margin-top: 8px; }

    .close-btn { background: #ff4757; color: white; border: none; padding: 15px; border-radius: 15px; font-weight: 900; font-size: 16px; margin-top: 15px; width: 100%; box-shadow: 0 5px 0 #c0392b; cursor: pointer; text-transform: uppercase; }
    .close-btn:active { transform: translateY(5px); box-shadow: none; }

    /* GAME HUD (In-Game Stats & Controls) */
    #game-hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
    .hud-btn { pointer-events: auto; background: #0a1931; color: white; border: 2px solid #00eaff; width: 45px; height: 45px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: bold; cursor: pointer; }
    
    .hidden { display: none !important; }
  </style>

  <!-- Three.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
  <main id="game">
    <!-- 3D Canvas -->
    <canvas id="canvas"></canvas>

    <!-- UI LAYER -->
    <div id="ui-layer">
      
      <!-- MENU BAR -->
      <div id="menu-top-bar" class="top-bar">
        <div class="status-pill">🏆 BEST: <span id="menuBestScore">0</span></div>
        <div class="status-pill gold">🪙 <span id="menuCoinsTotal">0</span></div>
      </div>

      <!-- IN-GAME HUD -->
      <div id="game-hud" class="hidden">
        <div class="status-pill">SCORE: <span id="inGameScore">0</span></div>
        <div class="status-pill gold">🪙 <span id="inGameCoins">0</span></div>
        <div class="hud-btn" id="pauseBtn">||</div>
      </div>

      <!-- MAIN MENU (Title & Play Button) -->
      <div id="main-menu">
        <div class="title-container">
          <h1 class="game-title">RUNNER</h1>
        </div>
        
        <div class="center-menu">
          <button id="playBtn" class="play-btn">▶ PLAY</button>
        </div>

        <div class="bottom-nav">
          <div class="nav-btn" onclick="showModal('profileModal')">
            <span class="icon">👤</span><span>Profile</span>
          </div>
          <div class="nav-btn" onclick="showModal('settingsModal')">
            <span class="icon">⚙️</span><span>Settings</span>
          </div>
          <div class="nav-btn store-btn" onclick="showModal('storeModal')">
            <span class="icon">🛒</span><span>Store</span>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL PANELS -->
    
    <!-- Profile -->
    <div id="profileModal" class="modal-overlay hidden">
      <div class="modal-panel">
        <h2 class="modal-title">Profile</h2>
        <div class="setting-row">Total Runs: <strong id="statsRuns">0</strong></div>
        <div class="setting-row">High Score: <strong id="statsScore">0</strong></div>
        <div class="setting-row">Total Coins: <strong id="statsCoins" style="color:#ffd700;">0</strong></div>
        <button class="close-btn" onclick="closeModals()">BACK</button>
      </div>
    </div>

    <!-- Settings -->
    <div id="settingsModal" class="modal-overlay hidden">
      <div class="modal-panel">
        <h2 class="modal-title">Settings</h2>
        <div class="setting-row">Sound <strong>ON</strong></div>
        <div class="setting-row">Music <strong>ON</strong></div>
        <button class="close-btn" onclick="closeModals()">BACK</button>
      </div>
    </div>

    <!-- Store -->
    <div id="storeModal" class="modal-overlay hidden">
      <div class="modal-panel">
        <h2 class="modal-title">Store</h2>
        <div class="store-grid">
          <div class="store-item">👕 Neon Suit<span>🔒 1000</span></div>
          <div class="store-item">🛹 Hoverboard<span>🔒 2500</span></div>
        </div>
        <button class="close-btn" onclick="closeModals()">BACK</button>
      </div>
    </div>

    <!-- Pause -->
    <div id="pauseModal" class="modal-overlay hidden">
      <div class="modal-panel">
        <h2 class="modal-title">PAUSED</h2>
        <button class="play-btn" style="width: 100%; justify-content:center; margin-bottom:15px; font-size:20px; padding:15px;" id="resumeBtn">RESUME</button>
        <button class="close-btn" id="pauseHomeBtn" style="margin-top:0;">QUIT TO MENU</button>
      </div>
    </div>

    <!-- Game Over -->
    <div id="gameOverModal" class="modal-overlay hidden">
      <div class="modal-panel">
        <h2 class="modal-title" style="color:#ff4757;">RUN OVER!</h2>
        <div class="setting-row">Score: <strong id="goScore" style="font-size:22px;">0</strong></div>
        <div class="setting-row">Coins: <strong id="goCoins" style="color:#ffd700; font-size:22px;">0</strong></div>
        
        <button id="reviveBtn" class="play-btn" style="width: 100%; justify-content:center; font-size:16px; background:linear-gradient(180deg, #2ed573, #2f3542); box-shadow: 0 6px 0 #1e90ff; margin: 15px 0;">📺 WATCH AD TO REVIVE</button>
        
        <div style="display:flex; gap:10px;">
          <button class="play-btn" style="flex:1; justify-content:center; font-size:16px; padding:15px 0;" id="restartBtn">RETRY</button>
          <button class="close-btn" style="flex:1; margin-top:0;" id="goHomeBtn">HOME</button>
        </div>
      </div>
    </div>

  </main>

  <script>
    // --- UI AND LOCAL STORAGE LOGIC ---
    const menuTopBar = document.getElementById('menu-top-bar');
    const mainMenu = document.getElementById('main-menu');
    const gameHud = document.getElementById('game-hud');
    const allModals = document.querySelectorAll('.modal-overlay');

    let totalCoins = Number(localStorage.getItem('runnerTotalCoins') || 0);
    let bestScore = Number(localStorage.getItem('runnerBestScore') || 0);
    let totalRuns = Number(localStorage.getItem('runnerTotalRuns') || 0);

    function updateMenuStats() {
      document.getElementById('menuBestScore').innerText = bestScore;
      document.getElementById('menuCoinsTotal').innerText = totalCoins;
      document.getElementById('statsScore').innerText = bestScore;
      document.getElementById('statsRuns').innerText = totalRuns;
      document.getElementById('statsCoins').innerText = totalCoins;
    }
    updateMenuStats();

    function showModal(id) {
      closeModals();
      document.getElementById(id).classList.remove('hidden');
    }
    function closeModals() {
      allModals.forEach(m => m.classList.add('hidden'));
    }

    // --- THREE.JS 3D ENVIRONMENT ---
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x60a3d9); // Sky Blue
    scene.fog = new THREE.Fog(0x60a3d9, 20, 100);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 8);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // Road Setup
    const roadGeo = new THREE.PlaneGeometry(12, 200);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -50;
    scene.add(road);

    // --- PLAYER & ANIMATION SETUP ---
    let playerModel = new THREE.Group(); 
    scene.add(playerModel);
    let mixer; // Animation Mixer for running

    const loader = new THREE.GLTFLoader();
    loader.load('assets/models/Rigged male character model.glb', (gltf) => {
      scene.remove(playerModel);
      playerModel = gltf.scene;
      playerModel.scale.set(1.2, 1.2, 1.2);
      playerModel.position.set(0, 0, 0);
      playerModel.rotation.y = Math.PI; // Face forward
      scene.add(playerModel);

      // Play Animation if exists in model
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(playerModel);
        const action = mixer.clipAction(gltf.animations[0]);
        action.play();
      }
    }, undefined, (e) => console.log('Model load error:', e));

    // Game Variables
    let running = false;
    let paused = false;
    let lastTime = performance.now();
    let score = 0, currentCoins = 0;
    let speed = 25;
    let playerLane = 0; // -1, 0, 1
    const laneWidth = 3;
    let jumpVelocity = 0, jumpHeight = 0;
    let objects = [];
    let isRevived = false;
    let invincibilityTimer = 0;
    let spawnTimer = 0;

    // Object Spawner (Coins & Barriers)
    function spawnObject() {
      const lane = Math.floor(Math.random() * 3) - 1;
      const isCoin = Math.random() < 0.5;
      
      let mesh;
      if (isCoin) {
        const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
        const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xb8860b });
        mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.y = 1;
      } else {
        const geo = new THREE.BoxGeometry(1.8, 1.8, 1.8);
        const mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, emissive: 0x800000 });
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 0.9;
      }
      mesh.position.x = lane * laneWidth;
      mesh.position.z = -100; 
      scene.add(mesh);
      objects.push({ mesh, type: isCoin ? 'coin' : 'barrier', removed: false });
    }

    // Controls
    function moveLeft() { if(running && !paused) playerLane = Math.max(-1, playerLane - 1); }
    function moveRight() { if(running && !paused) playerLane = Math.min(1, playerLane + 1); }
    function jump() { if(running && !paused && jumpHeight <= 0.1) jumpVelocity = 15; }

    // Touch Controls (Swipe)
    let startX = 0, startY = 0;
    window.addEventListener("pointerdown", e => { startX = e.clientX; startY = e.clientY; });
    window.addEventListener("pointerup", e => {
      if (!running || paused) return;
      let dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) dx > 0 ? moveRight() : moveLeft();
        else if (dy < 0) jump();
      }
    });

    // Keyboard Controls
    window.addEventListener("keydown", e => {
      if (e.code === "ArrowLeft") moveLeft();
      if (e.code === "ArrowRight") moveRight();
      if (e.code === "ArrowUp" || e.code === "Space") jump();
    });

    // Core Game Flow Functions
    function startGame() {
      totalRuns++;
      localStorage.setItem('runnerTotalRuns', totalRuns);
      
      score = 0; currentCoins = 0; speed = 30; playerLane = 0; jumpHeight = 0;
      isRevived = false; invincibilityTimer = 0;
      if (playerModel) playerModel.position.set(0, 0, 0);
      
      objects.forEach(o => scene.remove(o.mesh));
      objects = [];

      document.getElementById('inGameScore').innerText = "0";
      document.getElementById('inGameCoins').innerText = "0";

      menuTopBar.classList.add('hidden');
      mainMenu.classList.add('hidden');
      gameHud.classList.remove('hidden');
      closeModals();

      running = true; paused = false;
      lastTime = performance.now();
    }

    function triggerGameOver() {
      running = false;
      if(score > bestScore) { bestScore = score; localStorage.setItem('runnerBestScore', bestScore); }
      totalCoins += currentCoins; localStorage.setItem('runnerTotalCoins', totalCoins);
      
      document.getElementById('goScore').innerText = score;
      document.getElementById('goCoins').innerText = currentCoins;
      document.getElementById('reviveBtn').style.display = isRevived ? 'none' : 'flex';
      
      showModal('gameOverModal');
      updateMenuStats();
    }

    // Main Game Engine Loop
    function animate(currentTime) {
      requestAnimationFrame(animate);
      const delta = Math.min(0.05, (currentTime - lastTime) / 1000);
      lastTime = currentTime;

      // Road animation continues even in menu for premium feel
      road.position.z += (running && !paused ? speed : 10) * delta;
      if(road.position.z > 0) road.position.z = -50;

      if (!running || paused) return;

      // Update Character Animation
      if (mixer) mixer.update(delta);

      speed = Math.min(80, speed + delta * 0.5);
      score += Math.floor(speed * delta * 0.5);
      document.getElementById('inGameScore').innerText = score;
      if(invincibilityTimer > 0) invincibilityTimer -= delta;

      // Player Movement Logic
      if (playerModel) {
        playerModel.position.x += (playerLane * laneWidth - playerModel.position.x) * delta * 15;
        
        // Backup Bobbing (If model has no animations)
        if(!mixer && jumpHeight <= 0) {
           playerModel.position.y = Math.abs(Math.sin(currentTime * 0.015)) * 0.2; 
        }

        // Jump Logic
        if (jumpVelocity !== 0 || jumpHeight > 0) {
          jumpHeight += jumpVelocity * delta;
          jumpVelocity -= 40 * delta; 
          if (jumpHeight <= 0) { jumpHeight = 0; jumpVelocity = 0; }
          playerModel.position.y = jumpHeight;
        }

        // Invincibility Blink
        playerModel.visible = invincibilityTimer > 0 ? (Math.floor(currentTime / 100) % 2 === 0) : true;
      }

      // Spawning Objects
      spawnTimer -= delta;
      if (spawnTimer <= 0) { spawnObject(); spawnTimer = Math.max(0.4, 1.2 - speed/100); }

      // PERFECT COLLISION DETECTION (Manual Hitbox)
      const pX = playerModel.position.x;
      const pY = playerModel.position.y;
      const pZ = playerModel.position.z;
      // Define a strict, tight manual bounding box for the player (ignores big invisible model parts)
      const playerBox = new THREE.Box3(
        new THREE.Vector3(pX - 0.5, pY, pZ - 0.5),
        new THREE.Vector3(pX + 0.5, pY + 1.8, pZ + 0.5)
      );

      for (let i = objects.length - 1; i >= 0; i--) {
        let o = objects[i];
        if (o.removed) continue;

        o.mesh.position.z += speed * delta;
        if (o.type === 'coin') o.mesh.rotation.y += delta * 5;

        const objBox = new THREE.Box3().setFromObject(o.mesh);
        
        if (playerBox.intersectsBox(objBox)) {
          if (o.type === 'coin') {
            currentCoins++; document.getElementById('inGameCoins').innerText = currentCoins;
            scene.remove(o.mesh); o.removed = true;
          } else if (invincibilityTimer <= 0) {
            triggerGameOver(); // Hit Barrier!
          }
        }
        if (o.mesh.position.z > 10) { scene.remove(o.mesh); o.removed = true; }
      }
      objects = objects.filter(o => !o.removed);

      renderer.render(scene, camera);
    }
    
    // Start Render Loop
    renderer.render(scene, camera);
    requestAnimationFrame(animate);

    // Setup UI Button Actions
    document.getElementById('playBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('pauseBtn').addEventListener('click', () => { paused = true; showModal('pauseModal'); });
    document.getElementById('resumeBtn').addEventListener('click', () => { paused = false; closeModals(); });
    
    document.getElementById('goHomeBtn').addEv
